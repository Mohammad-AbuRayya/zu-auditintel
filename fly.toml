# النشر على Fly.io: الصورة تُبنى من Dockerfile الجذر على باني Fly البعيد، فلا Docker على جهاز
# المطوّر ولا صورة تُرفع يدوياً. والقيم هنا تحاذي الماكينة القائمة (iad، منفذ 10000، gigabyte)
# فيكون النشر تحديثاً لها لا ترحيلاً إلى منطقة أخرى ولا تصغيراً لذاكرةٍ قد تخنق العميل.

app = "zu-auditintel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  PORT = "10000"
  # مسار حلقة مفاتيح الحماية على القرص الثابت: بلا هذا المتغيّر يُكتب المفتاح في ذاكرة الحاوية
  # فيبطل كل كوكي دخولٍ وكل توكن antiforgery عند أول إقلاعٍ بارد.
  DataProtection__KeysPath = "/data/keys"

# القرص يحمل مفاتيح DataProtection وحدها: تُفكّ كوكيز الدخول، فمكانها قرصٌ داخل الماكينة لا
# مجموعة وثائقٍ سحابية يقرؤها كل من يحمل مفتاح الخدمة.
[mounts]
  source = "zu_data"
  destination = "/data"

# Blazor Server يعيش على WebSocket، وFly يعدّه نشاطاً فلا ينام الجهاز ما دامت لوحةٌ مفتوحة.
# والإيقاف عند الخمول هو ما يُبقي الفاتورة على قدر الاستخدام لا على قدر الشهر.
[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
