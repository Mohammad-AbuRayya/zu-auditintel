# بناء صورة الحاوية ودفعها إلى سجل GitHub عند كل دفعٍ إلى master.
# الفرع master هو الافتراضي على GitHub (origin/HEAD يشير إليه)، وهو ما يُنشر منه التطبيق.
name: CD

on:
  push:
    branches: [master]
  # تشغيل يدوي من تبويب Actions: يُجرَّب به السير دون دفعٍ إلى master.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # packages: write هي التي تسمح لـ GITHUB_TOKEN بالدفع إلى السجل، فبلاها يفشل الدفع بـ 403
    # رغم نجاح البناء. وcontents: read وحدها تكفي للاسترجاع.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # وسمان لكل دفعة: latest يتبع رأس الفرع، ووسمٌ ببصمة الـ commit لا يتغيّر أبداً
      # فيمكن الرجوع إلى صورةٍ بعينها لو أحدثت التالية خللاً.
      # واسم المستودع فيه أحرف كبيرة والسجل يرفضها، فلا تُقلَب هنا: metadata-action يصغّرها وحده.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # السياق هو جذر المستودع لا مجلد المشروع: الـ Dockerfile ينسخ ZU_AuditIntel.Web/‎
      # بمسارها من الجذر، فسياقٌ أضيق يُفشل COPY. والمنصة linux/amd64 هي معمار ماكينة Fly.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max